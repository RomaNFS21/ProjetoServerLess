AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  rota-vital-guias
  Função serverless para gerar guia de transporte de requisição do Rota Vital.

Globals:
  Function:
    Timeout: 3

Resources:
  GuiaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Events:
        Guias:
          Type: Api
          Properties:
            Path: /guias
            Method: post

Outputs:
  GuiasApi:
    Description: "URL da API Gateway para a função de guias"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/guias/"
  GuiaFunction:
    Description: "ARN da função GuiaFunction"
    Value: !GetAtt GuiaFunction.Arn
  GuiaFunctionIamRole:
    Description: "IAM Role da função GuiaFunction"
    Value: !GetAtt GuiaFunctionRole.Arn
